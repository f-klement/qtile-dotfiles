# swaylock, rose-pine-dawn palette. ~/bin/theme.sh copies the active variant to
# ~/.config/swaylock/config (generated, git-ignored); the image comes from
# .config/qtile/lock_with_random_bg_wayland.sh.
scaling=fill
color=faf4ed
font=Cantarell
font-size=20
indicator-radius=110
indicator-thickness=8
indicator-caps-lock
show-failed-attempts
ignore-empty-password

inside-color=faf4edcc
ring-color=f2e9e1
line-color=00000000
separator-color=00000000
text-color=575279
key-hl-color=907aa9
bs-hl-color=b4637a
layout-bg-color=faf4edcc
layout-border-color=00000000
layout-text-color=575279

inside-ver-color=faf4edcc
ring-ver-color=56949f
line-ver-color=00000000
text-ver-color=56949f

inside-wrong-color=faf4edcc
ring-wrong-color=b4637a
line-wrong-color=00000000
text-wrong-color=b4637a

inside-clear-color=faf4edcc
ring-clear-color=ea9d34
line-clear-color=00000000
text-clear-color=ea9d34

inside-caps-lock-color=faf4edcc
ring-caps-lock-color=ea9d34
line-caps-lock-color=00000000
text-caps-lock-color=ea9d34
