# swaylock, Rosé Pine (dark). ~/bin/theme.sh copies the active variant to
# ~/.config/swaylock/config (generated, git-ignored); the image comes from
# .config/qtile/lock_with_random_bg_wayland.sh.
#
# Colours mirror .config/i3lock/rose-pine.conf value for value, so both backends
# lock to the same look. Keep the two in step when either changes. Palette slots
# (see .config/qtile/colors.py):
#   191724 base   1f1d2e surface  31748f pine   9ccfd8 foam
#   eb6f92 love   f6c177 gold     c4a7e7 iris   e0def4 text   908caa subtle
#
# NOTE: swaylock hands each line to its option parser as-is -- no trailing
# comments, no leading whitespace, or the value is parsed wrong.
#
# Two things i3lock does that upstream swaylock cannot: the clock
# (--clock/--timestr/--datestr are swaylock-effects only) and the custom
# verify/wrong glyphs.

scaling=fill
font=Cantarell
font-size=20
indicator-radius=110
indicator-thickness=8
# i3lock --indicator: ring visible before the first keystroke
indicator-idle-visible
indicator-caps-lock
show-failed-attempts
ignore-empty-password

# fallback when no wallpaper is found (base)
color=191724

# idle: base disc, iris ring, gold/love keystroke flashes, separator hidden.
# line-* repeats the ring colour throughout, as i3lock --line-uses-ring does.
inside-color=191724e6
ring-color=c4a7e7
line-color=c4a7e7
separator-color=19172400
text-color=e0def4
key-hl-color=f6c177
bs-hl-color=eb6f92

# verifying: pine disc, foam ring; i3lock keeps the text in fg, not foam
inside-ver-color=31748fe6
ring-ver-color=9ccfd8
line-ver-color=9ccfd8
text-ver-color=e0def4

# wrong: base disc, love ring; text in fg, as i3lock --wrong-color
inside-wrong-color=191724e6
ring-wrong-color=eb6f92
line-wrong-color=eb6f92
text-wrong-color=e0def4

# cleared input: no i3lock counterpart, so it follows the keystroke flash (gold)
inside-clear-color=191724e6
ring-clear-color=f6c177
line-clear-color=f6c177
text-clear-color=e0def4

# caps lock: gold ring, subtle text (i3lock --modif-color)
inside-caps-lock-color=191724e6
ring-caps-lock-color=f6c177
line-caps-lock-color=f6c177
text-caps-lock-color=908caa

# keyboard-layout box; i3lock draws bare text in --layout-color (subtle)
layout-bg-color=191724e6
layout-border-color=00000000
layout-text-color=908caa
