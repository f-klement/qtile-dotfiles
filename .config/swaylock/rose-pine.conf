# swaylock, rose-pine palette. ~/bin/theme.sh copies the active variant to
# ~/.config/swaylock/config (generated, git-ignored); the image comes from
# .config/qtile/lock_with_random_bg_wayland.sh.
scaling=fill
color=191724
font=Cantarell
font-size=20
indicator-radius=110
indicator-thickness=8
indicator-caps-lock
show-failed-attempts
ignore-empty-password

inside-color=191724cc
ring-color=26233a
line-color=00000000
separator-color=00000000
text-color=e0def4
key-hl-color=c4a7e7
bs-hl-color=eb6f92
layout-bg-color=191724cc
layout-border-color=00000000
layout-text-color=e0def4

inside-ver-color=191724cc
ring-ver-color=9ccfd8
line-ver-color=00000000
text-ver-color=9ccfd8

inside-wrong-color=191724cc
ring-wrong-color=eb6f92
line-wrong-color=00000000
text-wrong-color=eb6f92

inside-clear-color=191724cc
ring-clear-color=f6c177
line-clear-color=00000000
text-clear-color=f6c177

inside-caps-lock-color=191724cc
ring-caps-lock-color=f6c177
line-caps-lock-color=00000000
text-caps-lock-color=f6c177
