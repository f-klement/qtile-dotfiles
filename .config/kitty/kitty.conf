# include ./mocha.conf   # superseded by current-theme.conf (Rosé Pine)
font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
# url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
# The compositor (xcompmgr) provides translucency (90/85, set by qtile). kitty
# drawing its own
# alpha into a depth-32 window is a second blend path on Xvnc (suspected source
# of the 16px stripe episodes, 2026-09-14); keep the window opaque.
background_opacity 1.0


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME