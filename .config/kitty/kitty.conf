font_family      jetbrains mono nerd font
font_size        10
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_style        dotted
confirm_os_window_close 0
# Opaque: the compositor provides translucency; kitty's own alpha stripes on Xvnc.
background_opacity 1.0


# BEGIN_KITTY_THEME
# Rosé Pine
include current-theme.conf
# END_KITTY_THEME