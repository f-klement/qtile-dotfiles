# Rosé Pine (dark) dunst colours. theme.sh copies this to dunstrc.d/50-colors.conf.
# IMPORTANT: colors have to be defined in quotation marks, else "#" starts a comment.
[global]
    frame_color = "#c4a7e7"

[urgency_low]
    # base / subtle / muted frame
    background = "#191724"
    foreground = "#908caa"
    frame_color = "#6e6a86"

[urgency_normal]
    # base / text / iris frame
    background = "#191724"
    foreground = "#e0def4"
    frame_color = "#c4a7e7"

[urgency_critical]
    # base / text / love frame
    background = "#191724"
    foreground = "#e0def4"
    frame_color = "#eb6f92"
