# Rosé Pine Dawn (light) dunst colours. theme.sh copies this to dunstrc.d/50-colors.conf.
# IMPORTANT: colors have to be defined in quotation marks, else "#" starts a comment.
[global]
    frame_color = "#907aa9"

[urgency_low]
    # base / subtle / muted frame
    background = "#faf4ed"
    foreground = "#797593"
    frame_color = "#9893a5"

[urgency_normal]
    # base / text / iris frame
    background = "#faf4ed"
    foreground = "#575279"
    frame_color = "#907aa9"

[urgency_critical]
    # base / text / love frame
    background = "#faf4ed"
    foreground = "#575279"
    frame_color = "#b4637a"
