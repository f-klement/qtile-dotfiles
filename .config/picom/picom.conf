# picom for the xrdp/Xvnc session (Rocky 8, TigerVNC Xvnc, root ~5040x1920 over
# three RDP monitors). Everything is software: no GPU, GLX is llvmpipe. Derived
# from the FreeBSD/scfb config, but tuned against measurements on THIS box
# (2026-09-14, picom v11.2) -- two settings deliberately differ from scfb.

# xrender only. GLX here means llvmpipe: measured ~180 ms per full frame with all
# four cores pegged. xrender renders inside Xvnc via pixman: ~46 ms full frame.
backend = "xrender";
# Legacy render path: the v11 "new" xrender backend intermittently paints dark
# 1px stripes every 16px through translucent windows on Xvnc (all apps, in the
# framebuffer, inputs clean, survives picom restarts). The legacy backend is a
# different blend implementation; costs ~25% more Xvnc CPU on a scrolling
# terminal. Trying it since 2026-09-14 15:25 -- if the stripes are gone after a
# few days, keep it.
legacy-backends = true;

# Xvnc has no real vblank; picom logs "Disabling frame pacing" and vsync becomes
# a no-op. Say so explicitly instead of pretending it does something.
vsync = false;

# SAME AS SCFB after all, and the single most important line. Xvnc's DAMAGE
# extension is fine (xcompmgr composites pixel-exact from it), but picom v11.2
# mishandles damage for translucent windows on it: in-window content changes
# (scrolling, a browser pane re-laying out) are left half-painted in 8px bands
# every 16px until something forces a full repaint. Measured 2026-09-14:
# forced repaint after scrolling changed 1050/1050 rows with damage tracking,
# 0 rows without. Price of a full repaint per frame on this 9.7 Mpx root:
# ~46 ms in Xvnc (~20 fps ceiling), ~1.5x Xvnc CPU on a scrolling terminal,
# ~45% of a core while a TUI spinner animates in kitty. Accepted knowingly.
# Alternatives tried the same day: picom v13 (needs CC=clang on EL8) is stale
# with damage on even for opaque windows; xcompmgr is correct but ~3x dearer
# (no frame coalescing). v11.2 + damage is only correct for opaque windows.
use-damage = false;

# Keep every window composited. Unredirecting fullscreen windows hands them back
# to X and leaves stale regions when switching; it also gains nothing here since
# the damage-tracked composite is nearly free.
unredir-if-possible = false;

# Rounded corners off: the rounding path is another masked composite per window,
# and it also rounded the qtile bar (bare override-redirect internals with no
# window type, so exclusion rules are awkward). Flat corners, less work.
corner-radius = 0;
shadow = false;
fading = false;
blur = false;

# Window transparency DISABLED 2026-09-14: on this Xvnc software-RENDER path,
# picom blending any window below 100% produces intermittent dark 1px stripes
# every 16px across the whole window (all apps, worst on the large landscape
# monitor). Removing opacity is the only change with hard evidence behind it.
# The qtile bar keeps its own opacity=0.70 (set in config.py) -- that is a
# real ARGB window, not a picom blend, and does not stripe.
# opacity-rule = [ "90:focused", "85:!focused" ];
