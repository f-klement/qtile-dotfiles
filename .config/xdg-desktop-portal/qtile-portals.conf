# Portal routing for the qtile Wayland session (XDG_CURRENT_DESKTOP=qtile:wlroots,
# set in bin/starting-qtile-wayland.sh). Plasma keeps using kde-portals.conf.
[preferred]
default=gtk
# grim-style capture via wlr-screencopy (screen sharing in browsers/calls too)
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
# same wallet the Plasma session uses (ksecretd, unlocked by pam_kwallet)
org.freedesktop.impl.portal.Secret=kwallet
