# Hyprland config -- entry point.
#
# CORRECTION (2026-10-12): the .lua files in this directory
# (hyprland.lua/env.lua/monitors.lua/...) are DEAD -- this build (Hyprland
# 0.51.1 / hyprlang 0.6.4, built from source against Fedora 44's stable
# libs) has NO Lua config support at all (confirmed: zero occurrences of
# "lua" anywhere in hyprlang 0.6.4's own source). Native Lua config is a
# newer hyprlang feature than what we built; the reference repo
# (hyprland-arch-dotfiles) was written against a newer version. Hyprland
# only ever looks for hyprland.conf -- finding none, it silently
# autogenerated one and used that instead, which is why nothing (waybar,
# keyboard layout, monitors, window rules) was actually loaded.
#
# This replaces the .lua files with the same content in real hyprlang
# syntax, split the same way via `source =`. The .lua files are kept for
# now as a record of the (currently unusable) intended structure in case a
# later Hyprland/hyprlang upgrade adds Lua support -- delete them once this
# is confirmed stable.

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/settings.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
