# hyprlock config -- adapted from the reference repo's (itself based on the
# shipped example), Rose Pine colors inlined directly rather than via an
# external themes/<mode>/hyprlock.conf symlink (same simplification as
# settings.lua -- qtile doesn't have that indirection either). Background
# points at the wallpaper state file ~/bin/wallpaper.sh (shared with qtile)
# actually maintains, not the reference repo's unrelated rofi path.
#
# CAUTION: hyprlock can't be safely test-run from an agent shell -- it would
# actually try to lock the live session. Test it yourself once, ideally with
# a second TTY open the first time.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.local/state/wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgb(31, 29, 46)    # surface
    outer_color = rgb(196, 167, 231) # iris
    check_color = rgb(156, 207, 216) # foam
    fail_color = rgb(235, 111, 146)  # love

    font_color = rgb(224, 222, 244)  # text
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(224, 222, 244)
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(224, 222, 244)
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[de,us]
    color = rgb(224, 222, 244)
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
