# hyprpaper config -- minimal. ~/bin/wallpaper.sh (shared with qtile) does the
# actual preload/wallpaper/unload IPC calls at session start and on every
# manual change, so nothing is hardcoded here -- no stale path to go wrong.
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
ipc = on
splash = false
