# Monitor configuration
# See https://wiki.hypr.land/Configuring/Monitors/
#
# Real layout confirmed via `wlr-randr` under the qtile session on this
# host: built-in panel + Thunderbolt dock with two identical Samsung
# LF24T450G panels, told apart by serial. Matches qtile's config.py
# SCREEN["small"/"landscape"/"portrait"] roles and positions exactly.

monitor = eDP-1,1920x1080@59.999,0x840,1

# Landscape external (HNMX502924)
monitor = desc:Samsung Electric Company LF24T450G HNMX502924,1920x1200@74.94,3120x382,1

# Portrait external (HNMX502934), rotated 90 degrees
monitor = desc:Samsung Electric Company LF24T450G HNMX502934,1920x1200@74.94,1920x0,1,transform,1

# Fallback for any other/unlisted monitor.
monitor = ,preferred,auto,1

# Workspace 7/8/9 -> built-in/landscape/portrait, same three slots qtile's
# GROUP_ROLE uses (see windowrules.conf's debian-work VM routing).
# Declarative, applies whether or not the workspace already exists yet --
# unlike a one-time `hyprctl dispatch moveworkspacetomonitor` exec-once,
# which fails if the workspace hasn't been created yet (confirmed live:
# "workspace doesn't exist!" on a fresh session where nothing has touched
# 7/8/9 yet).
workspace = 7, monitor:eDP-1
workspace = 8, monitor:desc:Samsung Electric Company LF24T450G HNMX502924
workspace = 9, monitor:desc:Samsung Electric Company LF24T450G HNMX502934
