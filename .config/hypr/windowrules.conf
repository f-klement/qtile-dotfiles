# Window rules
# See https://wiki.hypr.land/Configuring/Window-Rules/
#
# Translated from the hyprland-arch-dotfiles reference's windowrules.lua
# itself -- the float/opacity/workspace rule LISTS below are the
# reference's own, not reinvented around qtile's GROUP_MATCHES scheme.
# Rules for apps not installed on this host are kept anyway (inert, zero
# cost) for fidelity, same as the reference ships them for apps its own
# author may not run either. Two exclusions, both genuine and already
# decided earlier this session, not qtile-preservation:
#   - hyprpolkitagent's float rule: this host deliberately kept the KDE
#     polkit agent instead of switching to hyprpolkitagent (already
#     working, already installed) -- float-polkit-kde below covers it.
#   - the boot.dev scraper-ticker rules: a window class tied to the
#     reference author's own personal project, not a generalizable app.
#
# ADDED, genuinely host-specific (this hardware has a multihead QEMU/SPICE
# VM the reference's author never needed to route, not present in any
# form in the reference repo):
#   - debian-work VM multihead routing (virt-viewer heads=2, title-matched,
#     one workspace per pinned monitor -- see monitors.conf).
#   - alert/notification-style windows (polkit prompt, the VM's own
#     titleless popups) floated + docked near the top of the screen.

##############################################
### FLOATING DIALOGS (reference's float_rule list) ###
##############################################

windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(nwg-look)$
windowrule = float, class:^(qt5ct)$
windowrule = float, class:^(mpv)$
windowrule = float, class:^([Rr]ofi)$
windowrule = float, class:^(zenity)$
windowrule = float, class:^([Yy]ad)$
windowrule = float, class:^(swayimg)$
windowrule = float, class:^(vlc)$
windowrule = float, class:^(Viewnior)$
windowrule = float, class:^(steam)$
windowrule = float, class:^(wine)$
windowrule = float, class:^(proton)$
windowrule = float, class:^(bottles)$
windowrule = float, class:^(laptop-mode-tool)$
windowrule = float, class:^(pinentry(-gtk-2)?)$
windowrule = float, class:^(ssh-askpass)$

# xdg-desktop-portal file pickers / save dialogs (flatpaks, browsers, ...)
# -- not in the reference (it doesn't run flatpaks the same way), but a
# real floating-dialog need on this host, same category as the rules above.
windowrule = float, class:^(xdg-desktop-portal-(gtk|kde)|org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$
windowrule = center, class:^(xdg-desktop-portal-(gtk|kde)|org\.freedesktop\.impl\.portal\.desktop\.(gtk|kde))$

# Screenshot editor (bin/screenshot.sh gui: slurp -> grim -> swappy)
windowrule = float, class:^(swappy|me\.jtheoof\.swappy)$
windowrule = center, class:^(swappy|me\.jtheoof\.swappy)$

windowrule = center, class:^(pavucontrol)$

windowrule = noblur, class:^(gamescope)$
windowrule = fullscreen, class:^(gamescope)$

################################################
### WORKSPACE ASSIGNMENT (reference's own app->workspace list) ###
################################################
# Reference assigns firefox/edge-beta->2, thunar->3, obs->4, steam/
# lutris->5 (silent), discord/webcord->7 (silent), audacious->9 (silent).
# Translated to the apps actually used here: brave for the firefox slot,
# dolphin for thunar. discord/webcord/audacious/steam/lutris aren't
# installed on this host -- kept anyway for fidelity (inert). Note:
# workspaces 7-9 are pinned one-per-monitor for the debian-work VM (see
# monitors.conf) -- if discord/audacious are ever installed, their
# reference-assigned workspace would land on a VM-pinned monitor. Real
# conflict if it ever matters, not a reason to renumber apps nobody runs
# today just to pre-empt it.

windowrule = workspace 2, class:^(brave-browser)$
windowrule = workspace 2, class:^(firefox)$
windowrule = workspace 2, class:^(Firefox-esr)$
windowrule = workspace 2, class:^(Microsoft-edge-beta)$
windowrule = workspace 3, class:^(org.kde.dolphin)$
windowrule = workspace 3, class:^([Tt]hunar)$
windowrule = workspace 4, class:^(com.obsproject.Studio)$
windowrule = workspace 5 silent, class:^([Ss]team)$
windowrule = workspace 5 silent, title:^([Ss]team)$
windowrule = workspace 5 silent, class:^(lutris)$
windowrule = workspace 7 silent, class:^(discord)$
windowrule = workspace 7 silent, class:^(WebCord)$
windowrule = workspace 9 silent, class:^([Aa]udacious)$

################################################################
### debian-work VM multihead (genuinely host-specific, see above) ###
################################################################
# heads=2 on the VM opens one virt-viewer window per guest display, titled
# "debian-work (1)"/"debian-work (2)" (or bare "debian-work" at a single
# head). Workspace 7 is pinned to the built-in screen, 8 to landscape, 9 to
# portrait.

windowrule = workspace 7, class:^(virt-viewer)$,title:^debian-work(\s\(1\))?$
windowrule = workspace 8, class:^(virt-viewer)$,title:^debian-work\s\(2\)$
windowrule = workspace 9, class:^(virt-viewer)$,title:^debian-work\s\(3\)$

# virt-viewer's own small popups (e.g. when an output/display closes) share
# its class but carry no title -- float + dock near top like other alerts.
windowrule = float, class:^(virt-viewer)$,title:^$

#####################################################
### ALERT / NOTIFICATION WINDOWS: dock near the top ###
#####################################################

windowrule = move 35% 3%, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = move 35% 3%, class:^(virt-viewer)$,title:^$

################
### OPACITY ###
################
# virt-viewer stays fully opaque (debian-work's SPICE GL surface) -- any
# opacity < 1.0 forces the compositor to alpha-composite every frame
# instead of scanning it out directly, a plausible source of tearing on a
# continuously updating GL surface.
windowrule = opacity 1.0 1.0, class:^(virt-viewer)$

windowrule = opacity 0.9 0.6, class:^([Rr]ofi)$
windowrule = opacity 0.9 0.7, class:^(brave-browser)$
windowrule = opacity 0.9 0.7, class:^(brave)$
windowrule = opacity 0.9 0.7, class:^(firefox)$
windowrule = opacity 0.9 0.7, class:^(Firefox-esr)$
windowrule = opacity 0.9 0.7, class:^([Tt]hunar)$
windowrule = opacity 0.9 0.7, class:^(org.kde.dolphin)$
windowrule = opacity 0.9 0.8, class:^(kitty)$
windowrule = opacity 0.9 0.7, class:^(codium-url-handler)$
windowrule = opacity 0.9 0.7, class:^(VSCodium)$
windowrule = opacity 0.9 0.7, class:^(com.obsproject.Studio)$
windowrule = opacity 0.9 0.7, class:^([Aa]udacious)$

#####################
### PICTURE IN PICTURE ###
#####################

windowrule = opacity 0.95 0.75, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 25% 25%, title:^(Picture-in-Picture)$
windowrule = move 72% 7%, title:^(Picture-in-Picture)$

##################
### LAYER RULES ###
##################

layerrule = blur, rofi

######################################
### MISC (from the shipped example config) ###
######################################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
