# Window rules
# See https://wiki.hypr.land/Configuring/Window-Rules/
#
# Kept only the float rules for apps actually in use (dropped
# steam/lutris/wine/discord/obs/audacious/etc from the reference repo).
# ADDED what qtile's config.py does that the reference repo never needed:
#   - debian-work VM multihead routing (qtile's VIRT_VIEWER_HEAD1/2/3):
#     virt-viewer's 2 (heads=2) windows, told apart by title, one per
#     pinned workspace/screen (see autostart.conf's moveworkspacetomonitor).
#   - alert/notification-style windows docked near the top of the screen
#     (qtile's ALERT_WINDOWS -> _dock_to_top), approximated with a fixed
#     top-center-ish `move` percentage -- hyprlang's windowrule language has
#     no dynamic "center by actual window width" primitive the way qtile's
#     Python hook computed one live.

######################
### FLOATING DIALOGS ###
######################

windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(nm-connection-editor)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(pavucontrol)$
windowrule = float, class:^(rofi)$
windowrule = float, class:^([Yy]ad)$
windowrule = float, class:^(dialog)$
windowrule = float, class:^(error)$
windowrule = float, class:^(notification)$
windowrule = float, class:^(pinentry(-gtk-2)?)$
windowrule = float, class:^(ssh-askpass)$

##############################################
### WORKSPACE ASSIGNMENT (qtile's GROUP_MATCHES) ###
##############################################

windowrule = workspace 1, class:^(brave-browser)$
windowrule = workspace 2, class:^(codium)$
windowrule = workspace 5, class:^(org.kde.dolphin)$
windowrule = workspace 6, class:^(obsidian)$

################################################################
### debian-work VM multihead (qtile's VIRT_VIEWER_HEAD1/2/3) ###
################################################################
# heads=2 on the VM opens one virt-viewer window per guest display, titled
# "debian-work (1)"/"debian-work (2)" (or bare "debian-work" at a single
# head). Workspace 7 is pinned to the built-in screen, 8 to landscape, 9 to
# portrait -- same three slots qtile uses.

windowrule = workspace 7, class:^(virt-viewer)$,title:^debian-work(\s\(1\))?$
windowrule = workspace 8, class:^(virt-viewer)$,title:^debian-work\s\(2\)$
windowrule = workspace 9, class:^(virt-viewer)$,title:^debian-work\s\(3\)$

# virt-viewer's own small popups (e.g. when an output/display closes) share
# its class but carry no title -- float + dock near top like other alerts.
windowrule = float, class:^(virt-viewer)$,title:^$

#########################################
### ALERT / NOTIFICATION WINDOWS: dock near the top ###
#########################################

windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = move 35% 3%, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(virt-viewer)$,title:^$
windowrule = move 35% 3%, class:^(virt-viewer)$,title:^$
windowrule = float, class:^(dialog)$
windowrule = move 35% 3%, class:^(dialog)$
windowrule = float, class:^(error)$
windowrule = move 35% 3%, class:^(error)$
windowrule = float, class:^(notification)$
windowrule = move 35% 3%, class:^(notification)$

################
### OPACITY ###
################
# virt-viewer stays fully opaque (debian-work's SPICE GL surface) -- same
# reasoning as qtile's _apply_opacity exclusion: any opacity < 1.0 forces
# the compositor to alpha-composite every frame instead of scanning it out
# directly, a plausible source of tearing/artifacts on a continuously
# updating GL surface.
windowrule = opacity 1.0 1.0, class:^(virt-viewer)$

windowrule = opacity 0.9 0.6, class:^(rofi)$
windowrule = opacity 0.9 0.85, class:^(brave-browser)$
windowrule = opacity 0.9 0.85, class:^(org.kde.dolphin)$
windowrule = opacity 0.9 0.85, class:^(kitty)$
windowrule = opacity 0.9 0.85, class:^(codium)$

##################
### LAYER RULES ###
##################

layerrule = blur, rofi

######################################
### MISC (from the shipped example config) ###
######################################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
