# Keybinds
# See https://wiki.hypr.land/Configuring/Binds/
#
# App launchers/commands match what qtile's config.py actually uses on this
# host (kitty, brave-browser, codium, dolphin, the Obsidian flatpak,
# ~/bin/screenshot.sh, wpctl/brightnessctl). wlogout covers the power menu.

$mainMod = SUPER
$browser = brave-browser
$term = kitty
$editor = codium
$files = dolphin
$notes = flatpak run md.obsidian.Obsidian
$screenshot = ~/bin/screenshot.sh

####################
### APPS / SYSTEM ###
####################

bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod CTRL, Q, exit,
bind = $mainMod, R, exec, rofi -show run
bind = $mainMod, E, exec, $editor
bind = $mainMod, Q, exec, $term
bind = $mainMod, D, exec, $files
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod ALT, Space, exec, pkill rofi || rofi -show drun
bind = $mainMod, L, exec, loginctl lock-session
bind = CTRL ALT, Delete, exec, wlogout

######################
### WINDOW ACTIONS ###
######################

bind = $mainMod, Space, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, X, forcekillactive
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, P, pseudo
# qtile's mod+n (lazy.layout.normalize, reset all window sizes) has no
# Hyprland equivalent -- dwindle doesn't have a single dispatcher that
# resets accumulated split ratios back to default, unlike qtile's layout
# engines which track and can reset per-window size overrides directly.
# Not bound rather than faking it with a no-op.
bind = $mainMod, G, togglegroup
bind = ALT, Tab, changegroupactive
# qtile's "t" (cycle focus to next window in the layout)
bind = $mainMod, T, cyclenext,
# qtile's mod+shift+Return (toggle split/unsplit sides of the stack) --
# dwindle's closest equivalent, toggles the active window's split direction
bind = $mainMod SHIFT, Return, togglesplit,
# qtile's mod+alt+Tab (cycle through layouts). Hyprland doesn't have
# qtile's 3-way Columns/Spiral/Max cycle -- the closest real equivalent is
# toggling the general:layout keyword between its two actual options
# (dwindle/master); there's no dispatcher for this, so it's a small inline
# shell toggle.
bind = $mainMod ALT, Tab, exec, sh -c 'cur=$(hyprctl getoption general:layout -j | grep -o "\"str\": *\"[a-z]*\"" | cut -d\" -f4); [ "$cur" = dwindle ] && hyprctl keyword general:layout master || hyprctl keyword general:layout dwindle'

##################
### FOCUS / MOVE ###
##################

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# qtile's mod+control+arrows (grow window in that direction), 20px steps
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

bind = $mainMod, Tab, focusmonitor, +1
bind = $mainMod SHIFT, Tab, focusmonitor, -1

# qtile's mod+alt+Left/Right (move window to the previous/next monitor
# specifically, verified against KeybindManager.cpp's moveActiveTo: args
# starting with "mon:" move the window's whole workspace to that monitor)
bind = $mainMod ALT, left, movewindow, mon:-1
bind = $mainMod ALT, right, movewindow, mon:+1

#################
### WORKSPACES ###
#################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

###################################################
### SCREENSHOTS (qtile's screenshot.sh, shared) ###
###################################################

bind = , Print, exec, $screenshot gui
bind = $mainMod ALT, S, exec, $screenshot gui
bind = SHIFT, Print, exec, $screenshot clip
bind = CTRL, Print, exec, $screenshot full

#############################################
### MEDIA / VOLUME / BRIGHTNESS (qtile's own commands) ###
#############################################

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
