# Keybinds
# See https://wiki.hypr.land/Configuring/Binds/
#
# Translated from the hyprland-arch-dotfiles reference's keybinds.lua
# itself (not reinvented around qtile's config.py muscle memory) --
# same keys, same dispatchers, same structure. Substitutions below are
# only for genuine host differences: apps/scripts the reference calls
# that don't exist here, swapped for the closest real equivalent on this
# machine. Where this host has no equivalent at all (RofiEmoji.sh needs
# the rofi-emoji plugin, not installed), the bind is left out rather than
# faked -- noted inline.

$mainMod = SUPER
$scripts = ~/.config/hypr/scripts
$userScripts = ~/.config/hypr/UserScripts

# Reference: KdeApp.sh dolphin (QT_QPA_PLATFORMTHEME=kde wrapper). Not
# needed here -- qt5ct + the kdeglobals merge (see theme.sh) already make
# plain `dolphin` render correctly without a wrapper.
$files = dolphin
# Native RPM not installed on this host (confirmed: `command -v
# brave-browser` finds nothing) -- only the flatpak (com.brave.Browser)
# is. Same adaptive fallback qtile's config.py uses.
$browser = sh -c 'command -v brave-browser >/dev/null && exec brave-browser || exec flatpak run com.brave.Browser'
$term = kitty
$mail = thunderbird
# Reference: zeditor (Zed). Not installed on this host -- codium is what's
# actually used here (same editor qtile's own config.py binds to SUPER+E).
$editor = codium
$notes = flatpak run md.obsidian.Obsidian
$screenshot = ~/bin/screenshot.sh

####################
### APPS / SYSTEM ###
####################

bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod, E, exec, $editor
bind = $mainMod, Q, exec, $term
bind = $mainMod, D, exec, $files
bind = $mainMod, M, exec, $mail
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod, W, exec, $userScripts/WallpaperSelect.sh
# Reference: CTRL+Escape -> stacer (GUI system monitor, not on Fedora).
# btop is what's actually installed here.
bind = CTRL, Escape, exec, kitty -e btop

bind = $mainMod ALT, Space, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = CTRL ALT, L, exec, loginctl lock-session
bind = CTRL ALT, P, exec, $scripts/Wlogout.sh

######################
### WINDOW ACTIONS ###
######################

bind = $mainMod, Space, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, X, forcekillactive
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod, P, pseudo
bind = $mainMod, G, togglegroup
bind = ALT, Tab, changegroupactive

############################
### FEATURES / EXTRAS ###
############################

# Reference binds both H (KeyHints.sh, a yad popup) and K (the hyprpanes
# keybindings pane) to two separate implementations of the same cheat
# sheet. This setup only has the hyprpanes one (KeybindsPane.py, actually
# ported and live), so both keys point at it.
bind = $mainMod, H, exec, $userScripts/hyprpanes.py toggle keybinds
bind = $mainMod, K, exec, $userScripts/hyprpanes.py toggle keybinds
bind = $mainMod ALT, R, exec, $scripts/Refresh.sh
# Reference: ALT+E -> RofiEmoji.sh, needs the rofi-emoji plugin. Not
# installed on this host -- left unbound rather than faked.
bind = $mainMod SHIFT, B, exec, $scripts/ChangeBlur.sh
bind = $mainMod SHIFT, G, exec, $scripts/GameMode.sh
bind = $mainMod ALT, K, exec, $scripts/SwitchKeyboardLayout.sh
bind = $mainMod ALT, L, exec, $scripts/ChangeLayout.sh
bind = $mainMod ALT, V, exec, $scripts/ClipManager.sh
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

bind = CTRL ALT, W, exec, ~/bin/wallpaper.sh

##############################
### LAYOUT (dwindle/master) ###
##############################

bind = $mainMod CTRL, D, layoutmsg, removemaster
bind = $mainMod, I, layoutmsg, addmaster
bind = $mainMod, J, cyclenext
# Reference's base keybinds.lua doesn't statically bind O -- togglesplit
# only appears there via ChangeLayout.sh's dynamic rebind under the
# master layout (and O is already SUPER+O -> Obsidian above, see
# ChangeLayout.sh's comment on why this setup doesn't do dynamic rebinds).
bind = $mainMod CTRL, Return, layoutmsg, swapwithmaster
bind = $mainMod CTRL, M, exec, hyprctl dispatch splitratio 0.3

################################
### MEDIA / HARDWARE KEYS ###
################################
# Reference calls Volume.sh/MediaCtrl.sh for these -- this host uses
# pactl/playerctl/brightnessctl directly instead (same commands qtile's
# own config.py binds), no extra wrapper scripts needed.

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86Sleep, exec, systemctl suspend
bindl = , XF86RFKill, exec, rfkill toggle wifi

bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioStop,  exec, playerctl stop

######################
### SCREENSHOTS ###
######################
# Reference: ScreenShot.sh (now/area/in5/in10/active timed variants) +
# a raw grim/slurp/swappy one-liner on SUPER+ALT+S. This host shares
# screenshot.sh with qtile instead (gui/full/clip modes) -- genuinely
# different shared infrastructure, not a qtile-preservation hack, so it
# keeps its own three modes rather than growing timer variants nobody
# asked for. Keys line up with the reference's closest equivalents.

bind = , Print, exec, $screenshot gui
bind = $mainMod SHIFT, Print, exec, $screenshot clip
bind = CTRL, Print, exec, $screenshot full
bind = $mainMod ALT, S, exec, $screenshot gui

##########################
### RESIZE / MOVE / FOCUS ###
##########################

binde = $mainMod CTRL, left,  resizeactive, -50 0
binde = $mainMod CTRL, right, resizeactive, 50 0
binde = $mainMod CTRL, up,    resizeactive, 0 -50
binde = $mainMod CTRL, down,  resizeactive, 0 50

bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

#################
### WORKSPACES ###
#################

bind = $mainMod, Tab,       workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

bind = $mainMod SHIFT, U, movetoworkspace, special
bind = $mainMod, U,       togglespecialworkspace

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

bind = $mainMod SHIFT, bracketleft,  movetoworkspace, -1
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1
bind = $mainMod CTRL, bracketleft,   movetoworkspacesilent, -1
bind = $mainMod CTRL, bracketright,  movetoworkspacesilent, +1

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bind = $mainMod, period,     workspace, e+1
bind = $mainMod, comma,      workspace, e-1

##############
### MOUSE ###
##############

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
