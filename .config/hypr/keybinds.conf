# Keybinds
# See https://wiki.hypr.land/Configuring/Binds/
#
# App launchers/commands match what qtile's config.py actually uses on this
# host (kitty, brave-browser, codium, dolphin, the Obsidian flatpak,
# ~/bin/screenshot.sh, wpctl/brightnessctl). wlogout covers the power menu.

$mainMod = SUPER
$browser = brave-browser
$term = kitty
$editor = codium
$files = dolphin
$notes = flatpak run md.obsidian.Obsidian
$screenshot = ~/bin/screenshot.sh

####################
### APPS / SYSTEM ###
####################

bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod, E, exec, $editor
bind = $mainMod, Q, exec, $term
bind = $mainMod, D, exec, $files
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, $notes
bind = $mainMod ALT, Space, exec, pkill rofi || rofi -show drun
bind = $mainMod, L, exec, loginctl lock-session
bind = CTRL ALT, Delete, exec, wlogout

######################
### WINDOW ACTIONS ###
######################

bind = $mainMod, Space, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, X, forcekillactive
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod, P, pseudo
bind = $mainMod, G, togglegroup
bind = ALT, Tab, changegroupactive

##################
### FOCUS / MOVE ###
##################

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, Tab, focusmonitor, +1
bind = $mainMod SHIFT, Tab, focusmonitor, -1

#################
### WORKSPACES ###
#################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

###################################################
### SCREENSHOTS (qtile's screenshot.sh, shared) ###
###################################################

bind = , Print, exec, $screenshot gui
bind = $mainMod ALT, S, exec, $screenshot gui
bind = SHIFT, Print, exec, $screenshot clip
bind = CTRL, Print, exec, $screenshot full

#############################################
### MEDIA / VOLUME / BRIGHTNESS (qtile's own commands) ###
#############################################

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
