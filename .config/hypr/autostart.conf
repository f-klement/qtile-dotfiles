# Autostart
# See https://wiki.hypr.land/Configuring/Keywords/#exec
#
# Daemon choices already decided for this session: hypridle/hyprlock/
# hyprpaper native; polkit-kde-authentication-agent-1 reused as-is; swaync
# instead of dunst. Everything specific to the reference repo's other host
# (TUXEDO tray tooling, radiotray-ng, hyprsunset, hyprpanes,
# kbuildsycoca6) dropped.

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit agent: kept as the KDE one (already installed, already working,
# fixed to dock to the top of the screen under qtile this same session)
# rather than switching to hyprpolkitagent.
exec-once = sh -c 'for p in /usr/libexec/kf6/polkit-kde-authentication-agent-1 /usr/libexec/polkit-kde-authentication-agent-1; do [ -x "$p" ] && exec "$p"; done'

# Bar and notifications
exec-once = waybar -c ~/.config/waybar/config -s ~/.config/waybar/style.css
exec-once = swaync

# Clipboard history (cliphist, paired with rofi)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Wallpaper daemon, then hand off to the shared wallpaper.sh (qtile uses the
# same script) to actually pick and load an image via hyprpaper's IPC --
# small delay so the IPC socket exists before the script calls it.
exec-once = hyprpaper
exec-once = sh -c 'sleep 1; ~/bin/wallpaper.sh restore || ~/bin/wallpaper.sh'

# Cursor theme: matches qtile's own light/dark-aware choice (config.py's
# wl_xcursor_theme), not the reference repo's unrelated Dracula-cursors
# preference.
exec-once = sh -c 'mode=$(cat ~/.local/state/theme-mode 2>/dev/null); theme=BreezeX-RosePine-Linux; [ "$mode" = light ] && theme=BreezeX-RosePineDawn-Linux; hyprctl setcursor "$theme" 24; gsettings set org.gnome.desktop.interface cursor-theme "$theme"; gsettings set org.gnome.desktop.interface cursor-size 24'

# Idle/lock handling (hypridle.conf: lock at 15min, screen off at 20min,
# suspend at 30min).
exec-once = hypridle

# Workspace 7/8/9 -> monitor pinning lives in monitors.conf as declarative
# `workspace = N, monitor:...` rules, not here. A one-time
# `moveworkspacetomonitor` exec-once was tried first and is WRONG: it fails
# ("workspace doesn't exist!") unless workspace N already exists, which it
# won't on a fresh login -- nothing has created 7/8/9 yet at exec-once time
# either. The declarative rule has no such ordering dependency.
