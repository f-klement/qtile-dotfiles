# hypridle config -- adapted from the reference repo's (same staggered
# timeouts): lock at 15min, screen off at 20min, suspend at 30min.
# after_sleep_cmd points at the watchdog script's real path on this host
# (~/.config/qemu-network-watchdog/, not the repo's ~/.config/hypr/scripts/).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on ; ~/.config/qemu-network-watchdog/QemuNetworkWatchdog.sh --once &
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
